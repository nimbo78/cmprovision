# Test bench: a Debian 13 container with its own copy of the app in ./trixie/app
# (filled by docker/bench.sh sync). The port is bound to localhost only.
services:
  trixie:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { DEBIAN: trixie, PHPV: "8.4", UID: "${BENCH_UID:-1000}", GID: "${BENCH_GID:-1000}" }
    image: cmprovision-bench:trixie
    container_name: cmprovision-trixie
    restart: unless-stopped
    ports: ["127.0.0.1:8082:80"]
    volumes:
      - ./trixie/app:/var/lib/cmprovision
      - composer-trixie:/home/app/.composer

volumes:
  composer-trixie:
