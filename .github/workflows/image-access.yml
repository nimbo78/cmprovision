name: Installed OS access helper

on:
  push:
    paths: ['public/tools/image-access', 'tests/tools/test_image_access.py', '.github/workflows/image-access.yml']
  pull_request:
    paths: ['public/tools/image-access', 'tests/tools/test_image_access.py', '.github/workflows/image-access.yml']

permissions:
  contents: read

jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests/tools -p test_image_access.py -v
