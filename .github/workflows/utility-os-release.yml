name: Publish independent Utility OS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'utility-os/**'
      - 'resources/shell/module-diagnostics.sh'
      - 'tools/utility-os/**'
      - '.github/workflows/utility-os-release.yml'
permissions:
  contents: read
concurrency:
  group: utility-os-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == (vars.CMPROVISION_RELEASE_REPOSITORY || 'nimbo78/cmprovision')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check immutable Utility OS version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, pathlib, re
          spec = importlib.util.spec_from_file_location('release', 'image/ci/release.py')
          release = importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
          version = re.search(r'^UOS_VERSION=(.+)$', pathlib.Path('utility-os/versions.env').read_text(), re.M)[1]
          assert re.fullmatch(r'[0-9]{4}\.(?:0[1-9]|1[0-2])(?:\.[0-9]+)?', version)
          target = release.release_for_tag(os.environ['REPOSITORY'], 'utility-os-'+version, missing_ok=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build='+('false' if target and not target['draft'] else 'true')+'\nversion='+version+'\n')
          if target and not target['draft']: print('Version already published; bump UOS_VERSION for a new immutable release.')
          PY
      - name: Host dependencies
        if: steps.version.outputs.build == 'true'
        env:
          SIGNING_CONFIGURED: ${{ secrets.CMPROVISION_UPDATE_SIGNING_KEY != '' }}
        run: |
          test "$SIGNING_CONFIGURED" = true || { echo 'Configure the publisher signing key before building a release.' >&2; exit 1; }
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc cpio rsync unzip file wget git python3 perl patch xz-utils bzip2 qemu-system-arm busybox dosfstools mtools minisign
          echo "UOS_WORK=$RUNNER_TEMP/uos-work" >> "$GITHUB_ENV"
          echo "UOS_CACHE=$RUNNER_TEMP/uos-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.version.outputs.build == 'true'
        with:
          path: ${{ runner.temp }}/uos-cache
          key: independent-uos-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: independent-uos-${{ runner.os }}-
      - name: Build and check the matching boot files and complete sources
        if: steps.version.outputs.build == 'true'
        run: |
          sh tools/utility-os/build.sh
          sh tools/utility-os/test.sh
      - name: Sign and publish the independent component
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.CMPROVISION_UPDATE_SIGNING_KEY }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo 'Publisher signing key is required.' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/publisher.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          unset UPDATE_SIGNING_KEY
          python3 image/ci/update_release.py utility-os --directory "$RUNNER_TEMP/utility-release" \
            --repository "$REPOSITORY" --source "$SOURCE_SHA" --timestamp "$(git show -s --format=%ct HEAD)" \
            --boot scriptexecute64 --legal "$UOS_WORK/output/legal-info" \
            --private-key "$key" --public-key debian/updates/publisher.pub
          python3 image/ci/publish_utility.py --directory "$RUNNER_TEMP/utility-release" \
            --repository "$REPOSITORY" --source "$SOURCE_SHA" --version "$VERSION" --public-key debian/updates/publisher.pub
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.version.outputs.build == 'true'
        with:
          path: ${{ runner.temp }}/uos-cache
          key: independent-uos-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
