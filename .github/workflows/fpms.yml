name: FPMS and HDMI displays
on:
  pull_request:
    paths: ['packaging/fpms/**', 'tools/fpms-*', 'tools/hdmi-wallboard.py', 'tools/rescue_wifi*.py', 'tests/tools/*fpms*', 'tests/tools/test_hdmi_wallboard.py', 'tests/network/test_rescue_wifi*.py', 'tests/tools/check_display_systemd.py', 'debian/control', 'debian/*wallboard*', 'debian/*fpms*', '.github/workflows/fpms.yml']
  push:
    paths: ['packaging/fpms/**', 'tools/fpms-*', 'tools/hdmi-wallboard.py', 'tools/rescue_wifi*.py', 'tests/tools/*fpms*', 'tests/tools/test_hdmi_wallboard.py', 'tests/network/test_rescue_wifi*.py', 'tests/tools/check_display_systemd.py', 'debian/control', 'debian/*wallboard*', 'debian/*fpms*', '.github/workflows/fpms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-panel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow>=10.1,<13' 'pytest>=8,<10' 'qrcode>=7.4,<9'
      - run: python -m unittest discover -s tests/tools -p test_fpms_control.py -v
      - run: python -m unittest discover -s tests/tools -p test_hdmi_wallboard.py -v
      - run: python -m unittest discover -s tests/network -p 'test_rescue_wifi*.py' -v
      - run: sudo python3 tests/tools/check_display_systemd.py
      - run: sh packaging/fpms/prepare.sh /tmp/cmprovision-fpms-source
      - run: python -m pytest tests/test_cmprovision.py tests/test_cmprovision_fonts.py tests/test_cmprovision_v2.py tests/test_portable_display.py tests/test_st7735_probe.py tests/test_hyperpixel.py tests/test_cmprovision_power.py tests/test_cmprovision_appearance.py tests/test_cmprovision_rescue_wifi.py tests/test_cmprovision_rescue_qr.py -q
        working-directory: /tmp/cmprovision-fpms-source
      - run: sh /tmp/cmprovision-fpms-source/tools/build-lite-deb.sh /tmp/fpms-packages
