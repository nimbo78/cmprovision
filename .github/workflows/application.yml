name: Application
run-name: ${{ inputs.station_image_tag && format('Station image {0}', inputs.station_image_tag) || 'Application checks' }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      station_image_tag:
        description: 'Optional release tag vX.Y.Z (blank package hashes build everything from source)'
        type: string
        default: ''
      station_image_package_sha256:
        description: 'Independently verified cmprovision4 package SHA-256'
        type: string
        default: ''
      station_image_fpms_sha256:
        description: 'Independently verified fpms-lite package SHA-256'
        type: string
        default: ''
      station_image_attach:
        description: 'Attach audited files to a draft (never publish)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || inputs.station_image_tag || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.station_image_tag == '') }}

jobs:
  php:
    name: PHP / Debian Trixie
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the test bench
        run: |
          docker build --pull --build-arg UID="$(id -u)" --build-arg GID="$(id -g)" \
            -f docker/Dockerfile -t cmprovision-test .
      - name: Install locked dependencies and run PHP tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --entrypoint sh -v "$GITHUB_WORKSPACE:/var/lib/cmprovision" \
            -e HOME=/tmp -e COMPOSER_HOME=/tmp/composer cmprovision-test -ec '
              composer install --no-interaction --prefer-dist --no-progress
              cp debian/env.example .env
              php artisan key:generate --force
              php artisan test
            '
  javascript:
    name: JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm run test:js

  image-release-checks:
    name: Image release guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests/image -p 'test_release_*.py' -v

  station-power:
    name: Station power controller
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests/power -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests/time -p 'test_*.py' -v
      - run: sudo python3 tests/power/check_systemd.py

  prepare-auto-release:
    name: Prepare stable release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == (vars.CMPROVISION_RELEASE_REPOSITORY || 'nimbo78/cmprovision')
    needs: [php, javascript, image-release-checks, station-power, station-updates, station-backups, station-updates-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin a new stable version after checks
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          CMPROVISION_RELEASE_REPOSITORY: ${{ vars.CMPROVISION_RELEASE_REPOSITORY || 'nimbo78/cmprovision' }}
        run: |
          python3 image/ci/automatic-release.py prepare --repository "$REPOSITORY" \
            --source-sha "$SOURCE_SHA" --source-directory "$GITHUB_WORKSPACE"

  automatic-release:
    name: Publish complete stable release
    if: needs.prepare-auto-release.outputs.release_tag != ''
    needs: prepare-auto-release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      CMPROVISION_UPDATE_SIGNING_KEY: ${{ secrets.CMPROVISION_UPDATE_SIGNING_KEY }}
    with:
      release_tag: ${{ needs.prepare-auto-release.outputs.release_tag }}
      expected_source_sha: ${{ needs.prepare-auto-release.outputs.source_sha }}
      publish_release: true

  station-updates:
    name: Signed station updates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - run: python3 -B -m unittest discover -s tests/updates -v

  station-backups:
    name: Full backups and loopback remote storage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t cmprovision-backup-tests .
      - name: Exercise encryption, root boundaries and real SFTP/FTP/FTPS/S3 endpoints
        run: |
          docker run --rm --user root --entrypoint sh -v "$GITHUB_WORKSPACE:/source:ro" cmprovision-backup-tests -ec '
            apt-get update
            apt-get install -y --no-install-recommends openssh-server python3-pyftpdlib python3-moto python3-openssl python3-flask-cors python3-jsonpath-ng
            cp -a /source /tmp/backup-tests
            cd /tmp/backup-tests
            CMPROVISION_REMOTE_ACCEPTANCE=1 CMPROVISION_LARGE_BACKUP_TEST=1 python3 -B -m unittest discover -s tests/backups -v
          '

  station-updates-integration:
    name: Debian update and rollback acceptance
    needs: station-updates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production package outside the test station
        run: |
          docker build --pull -f docker/Dockerfile -t cmprovision-update-builder .
          git archive --format=tar -o "$RUNNER_TEMP/update-source.tar" HEAD
          docker run --rm --user root --entrypoint sh \
            -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP:/output" \
            cmprovision-update-builder /source/tools/build-deb.sh /output/update-source.tar /output/update-packages
      - name: Prepare a disposable Debian station with masked boot services
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap systemd-container
          sudo python3 tests/updates/prepare_acceptance.py "$RUNNER_TEMP"/update-packages/cmprovision4_*_all.deb
      - name: Boot isolated station and check real install and automatic rollback
        run: |
          sudo systemd-run --quiet --collect --unit=cmprovision-update-bench-container \
            /usr/bin/systemd-nspawn --directory=/var/tmp/cmprovision-updates-bench \
            --machine=cmprovision-update-bench --private-network --boot --console=passive
          for attempt in $(seq 1 30); do
            if sudo systemd-run --quiet --machine=cmprovision-update-bench --pipe --wait --collect /usr/bin/true; then break; fi
            sleep 2
          done
          sudo systemd-run --machine=cmprovision-update-bench --pipe --wait --collect \
            --unit=cmprovision-updates-acceptance /usr/bin/python3 /fixture/run_acceptance.py \
            2>&1 | tee "$RUNNER_TEMP/update-acceptance.log"
      - name: Preserve acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: station-update-acceptance
          path: ${{ runner.temp }}/update-acceptance.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop the disposable station
        if: always()
        run: sudo machinectl terminate cmprovision-update-bench || true
      - name: Prepare a separate disposable full-restore station
        run: sudo python3 tests/backups/prepare_acceptance.py "$RUNNER_TEMP"/update-packages/cmprovision4_*_all.deb
      - name: Exercise real full backup, accounts, SSH, network and SQLite restoration
        run: |
          sudo systemd-run --quiet --collect --unit=cmprovision-backups-bench-container \
            /usr/bin/systemd-nspawn --directory=/var/tmp/cmprovision-backups-bench \
            --machine=cmprovision-backups-bench --private-network --boot --console=passive
          for attempt in $(seq 1 30); do
            if sudo systemd-run --quiet --machine=cmprovision-backups-bench --pipe --wait --collect /usr/bin/true; then break; fi
            sleep 2
          done
          sudo systemd-run --machine=cmprovision-backups-bench --pipe --wait --collect \
            --unit=cmprovision-backups-acceptance /usr/bin/python3 /fixture/backups-acceptance.py \
            2>&1 | tee "$RUNNER_TEMP/backup-acceptance.log"
          sudo systemd-run --machine=cmprovision-backups-bench --pipe --wait --collect \
            --unit=cmprovision-backups-failure-acceptance /usr/bin/python3 /fixture/backups-failure-acceptance.py \
            2>&1 | tee -a "$RUNNER_TEMP/backup-acceptance.log"
      - name: Preserve backup acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: station-backup-acceptance
          path: ${{ runner.temp }}/backup-acceptance.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop the full-restore station
        if: always()
        run: sudo machinectl terminate cmprovision-backups-bench || true

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.station_image_tag != '' && inputs.station_image_package_sha256 == '' && inputs.station_image_fpms_sha256 == ''
    needs: [php, javascript, image-release-checks, station-power]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ inputs.station_image_tag }}
      attach_to_draft: ${{ inputs.station_image_attach }}

  station-image:
    if: github.event_name == 'workflow_dispatch' && inputs.station_image_tag != '' && (inputs.station_image_package_sha256 != '' || inputs.station_image_fpms_sha256 != '')
    needs: [php, javascript, image-release-checks, station-power]
    permissions:
      contents: write
    uses: ./.github/workflows/station-image.yml
    with:
      release_tag: ${{ inputs.station_image_tag }}
      package_sha256: ${{ inputs.station_image_package_sha256 }}
      fpms_sha256: ${{ inputs.station_image_fpms_sha256 }}
      attach_to_draft: ${{ inputs.station_image_attach }}
