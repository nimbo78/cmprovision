name: Station image

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      package_sha256:
        required: true
        type: string
      fpms_sha256:
        required: true
        type: string
      attach_to_draft:
        type: boolean
        default: false
      package_artifact:
        type: string
        default: ''
      package_source_sha:
        type: string
        default: ''
    outputs:
      artifact:
        description: Audited image and packages artifact
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: station-image-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit / ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.package_artifact != ''
        with:
          name: ${{ inputs.package_artifact }}
          path: ${{ runner.temp }}/package-input
      - name: Verify packages and resolve immutable source
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_SHA: ${{ inputs.package_sha256 }}
          FPMS_SHA: ${{ inputs.fpms_sha256 }}
          ATTACH_TO_DRAFT: ${{ inputs.attach_to_draft }}
          PACKAGE_ARTIFACT: ${{ inputs.package_artifact }}
          SOURCE_SHA: ${{ inputs.package_source_sha }}
        run: |
          if [ -n "$PACKAGE_ARTIFACT" ]; then
            python3 control/image/ci/pipeline.py adopt --repository "$REPOSITORY" --tag "$RELEASE_TAG" \
              --source-sha "$SOURCE_SHA" --package-sha256 "$PACKAGE_SHA" --fpms-sha256 "$FPMS_SHA" \
              --incoming "$RUNNER_TEMP/package-input" --directory "$RUNNER_TEMP/station-release"
          else
            python3 control/image/ci/release.py prepare --repository "$REPOSITORY" \
              --tag "$RELEASE_TAG" --package-sha256 "$PACKAGE_SHA" --fpms-sha256 "$FPMS_SHA" \
              --directory "$RUNNER_TEMP/station-release" --attach-to-draft "$ATTACH_TO_DRAFT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Reserve space on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker image prune -af
          df -h /
          test "$(df -B1 --output=avail / | tail -1)" -gt 20000000000
      - name: Build the disposable Debian Trixie builder
        run: docker build --pull -f control/image/ci/Dockerfile -t cmprovision-image-builder control
      - name: Build and audit the image without release credentials
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          PACKAGE_SHA: ${{ inputs.package_sha256 }}
          FPMS_SHA: ${{ inputs.fpms_sha256 }}
          BUILD_CONTROL_SHA: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/station-work" "$RUNNER_TEMP/station-release/audit"
          docker run --rm --privileged -v /dev:/dev \
            -v "$GITHUB_WORKSPACE/source:/source:ro" \
            -v "$GITHUB_WORKSPACE/control/image/ci:/ci:ro" \
            -v "$RUNNER_TEMP/station-release:/output" \
            -v "$RUNNER_TEMP/station-work:/work" \
            -e RELEASE_VERSION -e SOURCE_SHA -e PACKAGE_SHA -e FPMS_SHA \
            -e BUILD_CONTROL_SHA -e BUILD_RUN_URL \
            cmprovision-image-builder bash /ci/build.sh
      - name: Check disposable systemd path and service integration
        run: |
          sudo env CMP_IMAGE_SYSTEMD_TEST=1 python3 -m unittest discover \
            -s source/tests/image -p test_fpms_systemd.py -v \
            2>&1 | tee "$RUNNER_TEMP/station-release/audit/systemd-tests.log"
      - name: Name the audited artifact
        id: artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "name=station-image-$RELEASE_TAG-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/station-release
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Preserve diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: station-image-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/station-release/audit
          retention-days: 3
          if-no-files-found: ignore

  attach:
    name: Attach to draft / no publication
    if: inputs.attach_to_draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/station-release
      - name: Verify files, source and draft before attaching
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_SHA: ${{ inputs.package_sha256 }}
          FPMS_SHA: ${{ inputs.fpms_sha256 }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python3 image/ci/release.py upload --repository "$REPOSITORY" --tag "$RELEASE_TAG" \
            --package-sha256 "$PACKAGE_SHA" --fpms-sha256 "$FPMS_SHA" --source-sha "$SOURCE_SHA" \
            --directory "$RUNNER_TEMP/station-release"
