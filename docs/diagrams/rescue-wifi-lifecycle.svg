<text x="968" y="385" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#746A5F" text-anchor="start" data-max-width="164">Off</text>
<text x="968" y="414" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="start" data-max-width="164">AP stays off</text>
