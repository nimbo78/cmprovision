<text x="48" y="151" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="start">Automatic rescue enabled · a typical outage and recovery</text>
