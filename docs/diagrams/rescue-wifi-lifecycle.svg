<text x="520" y="305" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" fill="#2A1A0C" text-anchor="start" data-max-width="160">Rescue AP</text>
