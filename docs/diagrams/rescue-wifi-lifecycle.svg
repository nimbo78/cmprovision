<text x="982" y="481" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#177C32" text-anchor="start" data-max-width="152">Wi-Fi: up</text>
