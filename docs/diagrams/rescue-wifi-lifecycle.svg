<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Wi-Fi and the rescue access point</title>
<desc id="desc">Automatic cycle: connected, searching, AP active, recovery, standby. Management Wi-Fi and AP are shown separately.</desc>
<metadata>{&quot;manual&quot;: 900, &quot;qr&quot;: 60, &quot;quiet&quot;: 60, &quot;recovery&quot;: 120, &quot;search&quot;: 600, &quot;spare&quot;: 30, &quot;stable&quot;: 60}</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#725B42"/></marker></defs>
<rect width="1200" height="710" rx="20" fill="#FFF7E8"/>
<text x="48" y="65" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="40" font-weight="700" fill="#2A1A0C" text-anchor="start" data-max-width="1104">Wi-Fi and the rescue access point</text>
<rect x="48" y="82" width="56" height="4" rx="2" fill="#E2681C"/>
