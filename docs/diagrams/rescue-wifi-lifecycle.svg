<rect x="48" y="548" width="1104" height="66" rx="12" fill="#FFE4CC"/>
<text x="72" y="589" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#8A3C0C" text-anchor="start" data-max-width="340">Wi-Fi + AP RECOVERY</text>
<text x="446" y="589" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" fill="#2A1A0C" text-anchor="start" data-max-width="680">Both connections can work at the same time.</text>
<text x="48" y="655" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#725B42" text-anchor="start" data-max-width="1104">Management returns before the timeout → no AP is started.</text>
<text x="48" y="687" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#725B42" text-anchor="start" data-max-width="1104">Management drops during recovery → the AP remains available.</text>
