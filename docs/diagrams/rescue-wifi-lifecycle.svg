<text x="962" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" fill="#8A3C0C" text-anchor="middle">05</text>
<rect x="944" y="218" width="208" height="304" rx="10" fill="#FFFDF8" stroke="#D8C7A8" stroke-width="1.5"/>
