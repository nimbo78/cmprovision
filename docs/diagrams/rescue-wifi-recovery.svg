<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">When does Rescue AP switch off?</title>
<desc id="desc">With no clients: 60 seconds of stable management, then 60 seconds without clients. Connected clients keep the AP available. QR expiry is separate.</desc>
<metadata>{&quot;manual&quot;: 900, &quot;qr&quot;: 60, &quot;quiet&quot;: 60, &quot;recovery&quot;: 120, &quot;search&quot;: 600, &quot;spare&quot;: 30, &quot;stable&quot;: 60}</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#725B42"/></marker></defs>
<rect width="1200" height="900" rx="20" fill="#FFF7E8"/>
<text x="48" y="65" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="40" font-weight="700" fill="#2A1A0C" text-anchor="start" data-max-width="1104">When does Rescue AP switch off?</text>
<rect x="48" y="82" width="56" height="4" rx="2" fill="#E2681C"/>
<text x="48" y="119" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#725B42" text-anchor="start" data-max-width="1104">First, stable management. Then, a client-free interval.</text>
<text x="48" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#2A1A0C" text-anchor="start" data-max-width="800">01  No AP clients connected</text>
<text x="1152" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" fill="#177C32" text-anchor="end" data-max-width="360">≈ 2 min + polling</text>
<rect x="220" y="200" width="360" height="96" rx="10" fill="#FFFDF8" stroke="#D8C7A8" stroke-width="1.5"/>
<text x="400" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="44" font-weight="700" fill="#E2681C" text-anchor="middle">60 s</text>
<text x="400" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#725B42" text-anchor="middle" data-max-width="330">Stable management</text>
<rect x="580" y="200" width="360" height="96" rx="10" fill="#FFFDF8" stroke="#D8C7A8" stroke-width="1.5"/>
<text x="760" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="44" font-weight="700" fill="#E2681C" text-anchor="middle">60 s</text>
<text x="760" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#725B42" text-anchor="middle" data-max-width="330">No clients</text>
<text x="48" y="335" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="600" fill="#2A1A0C" text-anchor="start" data-max-width="160">Management</text>
<text x="48" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="600" fill="#2A1A0C" text-anchor="start" data-max-width="160">Rescue AP</text>
<rect x="220" y="313" width="932" height="32" rx="6" fill="#E3F5E8"/>
<text x="686" y="337" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="21" font-weight="400" fill="#177C32" text-anchor="middle" data-max-width="880">Management is already available</text>
<rect x="220" y="362" width="720" height="34" rx="6" fill="#FFE4CC"/>
<text x="580" y="386" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="21" font-weight="700" fill="#8A3C0C" text-anchor="middle">AP RECOVERY</text>
<rect x="940" y="362" width="212" height="34" rx="6" fill="#F0EBE3"/>
<text x="1046" y="386" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#746A5F" text-anchor="middle">AP STANDBY</text>
<line x1="220" y1="401" x2="220" y2="409" stroke="#725B42" stroke-width="1.5"/>
<text x="220" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="middle">0 s</text>
<line x1="580" y1="401" x2="580" y2="409" stroke="#725B42" stroke-width="1.5"/>
<text x="580" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="middle">60 s</text>
<line x1="940" y1="401" x2="940" y2="409" stroke="#725B42" stroke-width="1.5"/>
<text x="940" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="middle">120 s</text>
<text x="48" y="494" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#2A1A0C" text-anchor="start" data-max-width="1104">02  An engineer is still connected</text>
<rect x="220" y="522" width="230" height="104" rx="10" fill="#FFFDF8" stroke="#D8C7A8" stroke-width="1.5"/>
<text x="335.0" y="570" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#2A1A0C" text-anchor="middle" data-max-width="206">60 s</text>
<text x="335.0" y="608" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="middle" data-max-width="206">Stable management</text>
<rect x="450" y="522" width="460" height="104" rx="10" fill="#FFE4CC" stroke="#D8C7A8" stroke-width="1.5"/>
<text x="680.0" y="570" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#8A3C0C" text-anchor="middle" data-max-width="436">…</text>
<text x="680.0" y="608" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="middle" data-max-width="436">Wait for the last client to leave</text>
<rect x="910" y="522" width="242" height="104" rx="10" fill="#FFFDF8" stroke="#D8C7A8" stroke-width="1.5"/>
<text x="1031.0" y="570" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="42" font-weight="700" fill="#2A1A0C" text-anchor="middle" data-max-width="218">60 s</text>
<text x="1031.0" y="608" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#725B42" text-anchor="middle" data-max-width="218">No clients</text>
<text x="48" y="672" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="600" fill="#2A1A0C" text-anchor="start" data-max-width="160">Rescue AP</text>
<rect x="220" y="648" width="932" height="36" rx="6" fill="#FFE4CC"/>
<text x="686" y="674" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#8A3C0C" text-anchor="middle" data-max-width="880">AP remains available</text>
<text x="1152" y="714" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#746A5F" text-anchor="end" data-max-width="460">Then AP STANDBY</text>
<text x="48" y="762" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#725B42" text-anchor="start" data-max-width="1104">Client count unknown → keep the AP available.</text>
<rect x="48" y="792" width="1104" height="74" rx="12" fill="#E8EFFC"/>
<text x="72" y="837" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#1F4FA8" text-anchor="start" data-max-width="210">QR · 60 s</text>
<text x="320" y="821" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#1F4FA8" text-anchor="start" data-max-width="800">Only the connection card closes.</text>
<text x="320" y="849" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#1F4FA8" text-anchor="start" data-max-width="800">The AP follows the rules above.</text>
</svg>
