<text x="24" y="564" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="start">светится 4,5 мс из 5 мс</text>
