<text x="902" y="549" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="start">кадры по 5 мс</text>
<text x="24" y="604" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#7A6650" text-anchor="start">Светодиод записывается только при смене состояния: PWR включается через почтовый ящик прошивки, и каждая запись — вызов.</text>
