<line x1="500" y1="232" x2="914" y2="232" stroke="#8E1B2E" stroke-width="1.5"/>
<text x="707" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#8E1B2E" text-anchor="middle">PWR: то же, на полцикла (1,5 с) позже</text>
<line x1="477" y1="236" x2="477" y2="258" stroke="#7A6650" stroke-width="1"/>
<text x="477" y="272" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="middle">тёмная пауза 0,15 с: оба погашены</text>
<text x="40" y="296" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#7A6650" text-anchor="start">Яркость — sin⁴ от фазы: плавный подъём и спад без резкого края.</text>
<text x="40" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="middle">0</text>
<text x="346.7" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="middle">1 с</text>
<text x="653.3" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="middle">2 с</text>
<text x="960" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="middle">3 с</text>
<text x="24" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#2A1A0C" text-anchor="start">Каждый кадр — 5 мс (200 кадров в секунду)</text>
<text x="24" y="376" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#7A6650" text-anchor="start">Светодиод включают на часть кадра и выключают; глаз усредняет мерцание, и видна яркость.</text>
<text x="24" y="422" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#2A1A0C" text-anchor="start">яркость 10%</text>
<text x="24" y="440" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#7A6650" text-anchor="start">светится 0,5 мс из 5 мс</text>
